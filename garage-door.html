<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Door Systems | EliteHomeUSA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: { 'garage-roll': 'garageRoll 5s ease-in-out infinite alternate' },
                    keyframes: {
                        garageRoll: {
                            '0%, 15%': { transform: 'translateY(0)' },
                            '85%, 100%': { transform: 'translateY(-80%)' }
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="font-sans antialiased text-slate-700 bg-slate-50 overflow-x-hidden selection:bg-blue-500 selection:text-white">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 fixed top-0 left-0 w-full z-50 shadow-sm">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold tracking-tight text-slate-900 flex items-center group">
                <i class="fa-solid fa-arrow-left text-sm mr-4 text-slate-400 group-hover:text-slate-900 transition-colors"></i>
                <i class="fa-solid fa-warehouse mr-3 text-blue-600"></i> Elite<span class="text-blue-600 font-light">Garage</span>
            </a>
            <a href="tel:+18005550199" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition shadow-md shadow-blue-600/20">
                <i class="fa-solid fa-phone mr-2"></i> Call Dispatch
            </a>
        </div>
    </header>

    <!-- Hero + Form -->
    <section class="relative pt-28 pb-24 overflow-hidden bg-white">
        <div class="container mx-auto px-6 relative z-10 flex flex-col lg:flex-row gap-12 items-center">
            
            <div class="lg:w-1/2" data-aos="fade-right">
                <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 mb-6">Garage Door <br><span class="text-blue-600">Repair & Install</span></h1>
                <p class="text-slate-600 mb-8 text-lg">High-tension springs, broken tracks, and motor failures resolved in hours, not days. Local dispatch monitoring 24/7.</p>
                
                <!-- Garage CSS Animation (Light Theme) -->
                <div class="w-full max-w-sm h-52 bg-slate-100 border border-slate-300 rounded-xl overflow-hidden relative shadow-lg p-2">
                    <!-- Garage Interior -->
                    <div class="absolute inset-0 bg-gradient-to-t from-blue-100 via-slate-100 to-slate-100 flex flex-col items-center justify-center z-0">
                        <i class="fa-solid fa-truck-fast text-4xl text-blue-600"></i>
                        <span class="text-xs uppercase tracking-widest text-blue-600 font-mono font-bold mt-2">Truck En Route</span>
                    </div>

                    <!-- Rolling Garage Door Panels -->
                    <div class="absolute inset-x-2 top-2 bottom-2 z-10 flex flex-col animate-garage-roll shadow-md rounded-t-md overflow-hidden">
                        <!-- Top Panel with Windows -->
                        <div class="h-1/4 bg-slate-200 border-b border-slate-300 flex items-center justify-evenly px-4">
                            <div class="w-10 h-4 bg-white border border-slate-400 rounded-sm"></div>
                            <div class="w-10 h-4 bg-white border border-slate-400 rounded-sm"></div>
                            <div class="w-10 h-4 bg-white border border-slate-400 rounded-sm"></div>
                        </div>
                        <!-- Panel 2 -->
                        <div class="h-1/4 bg-slate-200 border-b border-slate-300 flex items-center justify-center">
                            <div class="w-full mx-3 h-5 border border-slate-300 rounded-sm"></div>
                        </div>
                        <!-- Panel 3 -->
                        <div class="h-1/4 bg-slate-200 border-b border-slate-300 flex items-center justify-center">
                            <div class="w-full mx-3 h-5 border border-slate-300 rounded-sm"></div>
                        </div>
                        <!-- Panel 4 Bottom -->
                        <div class="h-1/4 bg-slate-200 border-b-4 border-slate-400 flex items-center justify-center relative">
                            <div class="w-full mx-3 h-5 border border-slate-300 rounded-sm"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Form Container -->
            <div class="lg:w-1/2 w-full max-w-md" data-aos="fade-left">
                <div class="bg-white border border-slate-200 rounded-2xl p-8 shadow-xl shadow-slate-200/60">
                    <h3 class="text-2xl font-bold text-slate-900 mb-6">System Diagnostic Request</h3>
                    <form action="#" method="POST" class="space-y-5 text-sm">
                        <div>
                            <label class="block text-slate-700 text-xs font-bold mb-2 uppercase tracking-wider">Full Name</label>
                            <input type="text" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-1 focus:ring-blue-600 placeholder-slate-400 transition" placeholder="Full Name">
                        </div>
                        <div>
                            <label class="block text-slate-700 text-xs font-bold mb-2 uppercase tracking-wider">Phone Number</label>
                            <input type="tel" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-1 focus:ring-blue-600 placeholder-slate-400 transition" placeholder="Phone Number">
                        </div>
                        <div>
                            <label class="block text-slate-700 text-xs font-bold mb-2 uppercase tracking-wider">Issue Description</label>
                            <select class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-1 focus:ring-blue-600 transition appearance-none">
                                <option>Torsion Spring Repair</option>
                                <option>Motor / Opener Issue</option>
                                <option>Door Off Track</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg transition-all shadow-lg shadow-blue-600/30">
                            Deploy Technician
                        </button>
                    </form>
                </div>
            </div>
            
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-10">
        <div class="container mx-auto px-6 text-center text-sm">
            <p>&copy; 2026 EliteHomeUSA. Precision Maintenance.</p>
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init();</script>
</body>
</html>
